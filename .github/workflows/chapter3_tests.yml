name: Weekly-petsc-run

on:
  push:           # run on every push to any branch
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:  # allow manual trigger as well

jobs:
  run-poisson:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Pull prebuilt Docker image
      run: |
        docker pull zoeleibowitz/petsc_devito_image:latest

    - name: Run 1d_poisson.py
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          zoeleibowitz/petsc_devito_image:latest \
          python3 Chapter3/3_1_1/1d_poisson.py
