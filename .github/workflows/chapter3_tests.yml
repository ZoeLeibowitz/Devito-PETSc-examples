name: Run Chapter 3 & Commit Plots

on:
  push:
    branches:
      - main
    # Ignore commits to PNG files to prevent workflow loops
    paths-ignore:
      - 'Chapter3/dimensions/**/*.png'
      - 'Chapter3/boundary_conditions/**/*.png'
      - 'Chapter3/higher_order/**/*.png'
      - 'Chapter3/time_dependent/**/*.png'
      - 'Chapter3/nonlinear/**/*.png'


      - 'Chapter3/coupled/**/*.png'

  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:  # allow manual trigger

env:
  # temporary test with geometric_multigrid image
  DOCKER_IMAGE: zoeleibowitz/devito-petsc:geometric_multigrid
  # DOCKER_IMAGE: devitocodes/devito-petsc:latest

jobs:
  run-chapter3:
    runs-on: ubuntu-latest

    steps:
    # Checkout repo
    - name: Checkout repo
      uses: actions/checkout@v4

    # Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Pull Docker image
    - name: Pull prebuilt Docker image
      run: docker pull $DOCKER_IMAGE

    # Run dimensions/poisson_1d - serial
    - name: Run dimensions/poisson_1d - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/dimensions/poisson_1d \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 1d_poisson.py

    # Run dimensions/poisson_2d - serial
    - name: Run dimensions/poisson_2d - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/dimensions/poisson_2d \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 2d_poisson.py

    # Run dimensions/poisson_3d - serial
    - name: Run dimensions/poisson_3d - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/dimensions/poisson_3d \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 3d_poisson.py

    # Run boundary_conditions/nullspace - serial
    - name: Run boundary_conditions/nullspace - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/boundary_conditions/nullspace \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 poisson_neumann.py

    # Run boundary_conditions/helmholtz_neumann - serial
    - name: Run boundary_conditions/helmholtz_neumann - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/boundary_conditions/helmholtz_neumann \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 2d_modified_helmholtz.py

    # Run higher_order/mirror - serial
    - name: Run higher_order/mirror - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/higher_order/mirror \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 modified_stencil_4th_order.py

    # Run higher_order/mirror order sweep - serial
    - name: Run higher_order/mirror - order sweep - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/higher_order/mirror \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 mirror_any_order.py

    # Run higher_order/compact - serial
    - name: Run higher_order/compact - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/higher_order/compact \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 poisson_collatz.py

    # Run boundary_conditions/laplace_mixed - serial
    - name: Run boundary_conditions/laplace_mixed - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/boundary_conditions/laplace_mixed \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 rectangle2d.py

    # Run time_dependent/heat_2d - serial
    - name: Run time_dependent/heat_2d - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/time_dependent/heat_2d \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 heat_2d.py

    # Run time_dependent/heat_3d_bcs - serial
    - name: Run time_dependent/heat_3d_bcs - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/time_dependent/heat_3d_bcs \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 heat_3d_bcs.py

    # Run time_dependent/wave_1d - serial
    - name: Run time_dependent/wave_1d - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/time_dependent/wave_1d \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 wave_1d.py

    # Run time_dependent/wave_2d - serial
    - name: Run time_dependent/wave_2d - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/time_dependent/wave_2d \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 wave_2d.py

    # Run time_dependent/wave_3d - serial
    - name: Run time_dependent/wave_3d - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/time_dependent/wave_3d \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 wave_3d.py

    # Run nonlinear/reaction - serial
    - name: Run nonlinear/reaction - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/nonlinear/reaction \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 reaction.py

    # Run coupled/biharmonic - serial
    - name: Run coupled/biharmonic - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/coupled/biharmonic \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          python3 biharmonic.py

    # Configure Git for commits
    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit plots and create PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH_NAME="update-ch3-$(date +%s)"
        git checkout -b $BRANCH_NAME
        git add Chapter3/dimensions/*/*.png
    
        git add Chapter3/boundary_conditions/*/*.png
        git add Chapter3/higher_order/*/*.png
        git add Chapter3/time_dependent/*/*.png
        git add Chapter3/nonlinear/*/*.png

        git add Chapter3/coupled/*/*.png

        if git diff --cached --quiet; then
          echo "No changes to commit, skipping PR."
          exit 0
        fi

        git commit -m "Update plots for Chapter3 from workflow"
        git push --set-upstream https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} $BRANCH_NAME
        gh auth setup-git
        gh pr create \
          --title "Update plots for Chapter3" \
          --body "Generated automatically by workflow." \
          --base main \
          --head $BRANCH_NAME
