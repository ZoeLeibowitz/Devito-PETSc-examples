name: Run Chapter 4 with MPI
# NOTE: purely checking for correctness .. using oversubscribe

on:
  push:
    branches:
      - main

  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:  # allow manual trigger

env:
  # temporary test with geometric_multigrid image
  DOCKER_IMAGE: zoeleibowitz/devito-petsc:geometric_multigrid
  # DOCKER_IMAGE: devitocodes/devito-petsc:latest
  DEVITO_MPI: "1"
  MPI_N: 2

jobs:
  run-chapter4:
    name: Run Chapter 4 (MPI n=2)
    runs-on: ubuntu-latest

    steps:
    # Checkout repo
    - name: Checkout repo
      uses: actions/checkout@v4

    # Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Pull Docker image
    - name: Pull prebuilt Docker image
      run: docker pull $DOCKER_IMAGE

    ####################################################################
    - name: Run cavity flow re=100, n=2 - parallel
      run: |
        docker run --rm -t \
          -e DEVITO_MPI \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Staggered/cavityflow/mpi_safe/RE100 \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          mpiexec --oversubscribe -n $MPI_N python3 re100.py

    ################################## 312 ##################################

    # Configure Git for commits
    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit plots and create PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH_NAME="update-ch4-$(date +%s)"
        git checkout -b $BRANCH_NAME

        git add Staggered/cavityflow/mpi_safe/RE100/*.png
        git add Staggered/cavityflow/mpi_safe/RE100/vortex_center_re100_2.txt


        if git diff --cached --quiet; then
          echo "No changes to commit, skipping PR."
          exit 0
        fi

        git commit -m "Update Chapter4 from workflow"
        git push --set-upstream https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} $BRANCH_NAME
        gh auth setup-git
        gh pr create \
          --title "Update Chapter4" \
          --body "Generated automatically by workflow." \
          --base main \
          --head $BRANCH_NAME
