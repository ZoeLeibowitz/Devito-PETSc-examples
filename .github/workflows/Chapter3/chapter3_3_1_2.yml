name: Run Chapter 3 - 3_1_1 & Commit Plots

on:
  push:
    branches:
      - main
    # Ignore commits to PNG files to prevent workflow loops
    paths-ignore:
      - 'Chapter3/3_1_2/*.png'
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:  # allow manual trigger

jobs:
  run-chapter3:
    runs-on: ubuntu-latest

    steps:
    # Checkout repo
    - name: Checkout repo
      uses: actions/checkout@v4

    # Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Pull Docker image
    - name: Pull prebuilt Docker image
      run: docker pull zoeleibowitz/petsc_devito_image:latest

    # Run 3_1_2 - serial
    - name: Run 3_1_2 - serial
      run: |
        docker run --rm -t \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/3_1_2 \
          -u $(id -u):$(id -g) \
          zoeleibowitz/petsc_devito_image:latest \
          python3 2d_poisson.py

    # Configure Git for commits
    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # Commit and push generated PNGs
    - name: Commit and push plots
      run: |
        git add Chapter3/3_1_2/*.png
        git commit -m "Update plots for Chapter3/3_1_2 from workflow" || echo "No changes to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
