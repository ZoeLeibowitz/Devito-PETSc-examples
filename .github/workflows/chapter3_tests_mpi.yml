name: Run Chapter 3 with MPI & Commit Plots

on:
  push:
    branches:
      - main
    # Ignore commits to PNG files to prevent workflow loops
    paths-ignore:

      - 'Chapter3/3_1_2/*.png'

  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:  # allow manual trigger

env:
  DOCKER_IMAGE: devitocodes/devito-petsc:latest
  DEVITO_MPI: "1"

jobs:
  run-chapter3:
    runs-on: ubuntu-latest

    steps:
    # Checkout repo
    - name: Checkout repo
      uses: actions/checkout@v4

    # Log in to DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Pull Docker image
    - name: Pull prebuilt Docker image
      run: docker pull $DOCKER_IMAGE

    # Run 3_1_2 - parallel - TODO: make this a matrix to run over different ranks?? - the plot generated should have the no of ranks total in the filename..
    - name: Run 3_1_1 - serial
      run: |
        docker run --rm -t \
          -e DEVITO_MPI \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/Chapter3/3_1_2 \
          -u $(id -u):$(id -g) \
          $DOCKER_IMAGE \
          mpiexec --oversubscribe -n 2 python3 2d_poisson_mpi.py

    # Configure Git for commits
    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit plots and create PR
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH_NAME="update-ch3-$(date +%s)"
        git checkout -b $BRANCH_NAME

        git add Chapter3/3_1_2/*.png


        if git diff --cached --quiet; then
          echo "No changes to commit, skipping PR."
          exit 0
        fi

        git commit -m "Update plots for Chapter3 from workflow"
        git push --set-upstream https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} $BRANCH_NAME
        gh auth setup-git
        gh pr create \
          --title "Update plots for Chapter3" \
          --body "Generated automatically by workflow." \
          --base main \
          --head $BRANCH_NAME
